spring.application.name=pdf-assistant

# ==========================================
# 1. PostgreSQL Database Connection (JDBC)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/pdf_rag_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. PGVector Store Configuration
# ==========================================
# Automatically runs 'CREATE EXTENSION IF NOT EXISTS vector' and creates 'vector_store' table
spring.ai.vectorstore.pgvector.initialize-schema=true
# HNSW index makes cosine similarity searches ultra-fast
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# CRITICAL: mxbai-embed-large outputs 1024-dimensional arrays
spring.ai.vectorstore.pgvector.dimensions=1024

# ==========================================
# 3. Local Ollama Models (Chat + Embedding)
# ==========================================
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:7b
spring.ai.ollama.chat.temperature=0.0
spring.ai.ollama.embedding.model=mxbai-embed-large